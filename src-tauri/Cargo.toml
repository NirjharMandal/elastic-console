[package]
name = "elastic-console"
version = "0.1.0"
description = "Elastic Console — a native macOS Elasticsearch management console"
authors = ["Elastic Console"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "elastic_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }

[features]
# By default Tauri runs in production mode; this matches the CLI template.
custom-protocol = ["tauri/custom-protocol"]
